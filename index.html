<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otantik Restoran Turki</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --dark: #0d0a07;
    --cream: #F5EDD8;
    --red: #8B1A1A;
  }
  body {
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    background: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bg {
    position: fixed;
    inset: 0;
    background-image: url('bg.jpg');
    background-size: cover;
    background-position: center top;
    filter: brightness(0.32) saturate(0.7);
    z-index: 0;
  }
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse at 50% 100%, rgba(139,26,26,0.3) 0%, transparent 70%),
      linear-gradient(to bottom, rgba(13,10,7,0.5) 0%, rgba(13,10,7,0.15) 40%, rgba(13,10,7,0.75) 100%);
  }
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 48px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .ornament {
    width: 180px;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.1s;
  }
  .logo-wrap {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(13,10,7,0.7);
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    box-shadow: 0 0 40px rgba(201,168,76,0.25), inset 0 0 20px rgba(201,168,76,0.05);
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.2s;
  }
  .logo-wrap img { width: 85px; height: 85px; object-fit: contain; }
  .logo-placeholder {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.4;
  }
  .brand-name {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--cream);
    letter-spacing: 5px;
    text-align: center;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.35s;
  }
  .brand-sub {
    font-style: italic;
    font-size: 15px;
    color: var(--gold-light);
    letter-spacing: 5px;
    text-align: center;
    margin-top: 6px;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.45s;
  }
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.55s;
  }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
  .divider-diamond { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); flex-shrink: 0; }
  .btn-group { width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .btn {
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 24px;
    background: rgba(13,10,7,0.6);
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 2px;
    cursor: pointer;
    text-decoration: none;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.3s;
    opacity: 0;
    backdrop-filter: blur(6px);
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.15) 0%, rgba(139,26,26,0.1) 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .btn::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(to bottom, var(--gold), var(--red));
    transform: scaleY(0);
    transition: transform 0.3s ease;
    transform-origin: bottom;
  }
  .btn:hover { border-color: rgba(201,168,76,0.8); transform: translateX(4px); }
  .btn:hover::before { opacity: 1; }
  .btn:hover::after { transform: scaleY(1); }
  .btn:nth-child(1) { animation: fadeUp 0.8s ease forwards 0.65s; }
  .btn:nth-child(2) { animation: fadeUp 0.8s ease forwards 0.75s; }
  .btn:nth-child(3) { animation: fadeUp 0.8s ease forwards 0.85s; }
  .btn-icon {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(201,168,76,0.12);
    border: 1px solid rgba(201,168,76,0.35);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 18px;
    transition: background 0.3s;
  }
  .btn:hover .btn-icon { background: rgba(201,168,76,0.25); }
  .btn-content { flex: 1; text-align: left; }
  .btn-label {
    font-style: italic;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    display: block; line-height: 1; margin-bottom: 4px;
  }
  .btn-title {
    font-family: 'Cinzel', serif;
    font-size: 14px; font-weight: 600;
    color: var(--cream); letter-spacing: 1px; display: block;
  }
  .btn-arrow {
    color: var(--gold); font-size: 22px; opacity: 0.5;
    transition: opacity 0.3s, transform 0.3s;
  }
  .btn:hover .btn-arrow { opacity: 1; transform: translateX(3px); }
  .footer {
    margin-top: 40px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1s;
    text-align: center;
  }
  .footer p { font-style: italic; color: rgba(245,237,216,0.3); font-size: 12px; letter-spacing: 2px; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
  <svg class="ornament" viewBox="0 0 180 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="14" x2="62" y2="14" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.6"/>
    <path d="M70 14 L73 9 L76 14 L79 9 L82 14" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.8" fill="none"/>
    <path d="M86 10 L90 6 L94 10 L90 14 Z" stroke="#C9A84C" stroke-width="1" fill="rgba(201,168,76,0.15)"/>
    <path d="M86 18 L90 22 L94 18 L90 14 Z" stroke="#C9A84C" stroke-width="1" fill="rgba(201,168,76,0.15)"/>
    <path d="M98 14 L101 9 L104 14 L107 9 L110 14" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.8" fill="none"/>
    <line x1="118" y1="14" x2="180" y2="14" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.6"/>
  </svg>

  <div class="logo-wrap">
    <img src="logo.png" alt="Otantik Logo"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
    <div class="logo-placeholder" style="display:none">✦<br>OTANTIK</div>
  </div>

  <div class="brand-name">OTANTIK</div>
  <div class="brand-sub">Restoran Turki</div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line"></div>
  </div>

  <div class="btn-group">
    <a href="https://msha.ke/otantikturki?utm_medium=qr&utm_source=Milkshake%20QR%20code" class="btn">
      <div class="btn-icon">🕌</div>
      <div class="btn-content">
        <span class="btn-label">Lokasi Utama</span>
        <span class="btn-title">Center Rawamangun</span>
      </div>
      <span class="btn-arrow">›</span>
    </a>
    <a href="https://msha.ke/otantikvelodrome?utm_medium=qr&utm_source=Milkshake%20QR%20code" class="btn">
      <div class="btn-icon">🌙</div>
      <div class="btn-content">
        <span class="btn-label">Cabang 1</span>
        <span class="btn-title">Velodrome</span>
      </div>
      <span class="btn-arrow">›</span>
    </a>
    <a href="https://msha.ke/otantikmenteng?utm_medium=qr&utm_source=Milkshake%20QR%20code#links" class="btn">
      <div class="btn-icon">⭐</div>
      <div class="btn-content">
        <span class="btn-label">Cabang 2</span>
        <span class="btn-title">Menteng</span>
      </div>
      <span class="btn-arrow">›</span>
    </a>
  </div>

  <div class="footer">
    <p>Otantik · Cita Rasa Turki di Jakarta</p>
  </div>
</div>
</body>
</html>
